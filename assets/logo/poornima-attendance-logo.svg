<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <linearGradient id="pamsLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- LOGO ICON LEFT -->
  <g transform="translate(5, 5)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="url(#pamsLogoGrad)" />
    
    <!-- Cap -->
    <polygon points="40,18 66,28 40,38 14,28" fill="#FFFFFF" />
    <path d="M 25,33 L 25,41 C 25,47 55,47 55,41 L 55,33" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 60,29 L 64,40 L 64,45" fill="none" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />
    <circle cx="64" cy="46" r="1.5" fill="#FDE047" />

    <!-- Open Book -->
    <path d="M 16,50 C 27,47 37,52 38,65 C 28,62 18,63 16,50 Z" fill="#FFFFFF" opacity="0.9" />
    <path d="M 64,50 C 53,47 43,52 42,65 C 52,62 62,63 64,50 Z" fill="#FFFFFF" opacity="0.9" />
    <line x1="21" y1="56" x2="33" y2="56" stroke="#2563EB" stroke-width="1.8" opacity="0.7"/>
    <line x1="47" y1="56" x2="59" y2="56" stroke="#4F46E5" stroke-width="1.8" opacity="0.7"/>
  </g>

  <!-- TEXT BRANDING RIGHT -->
  <g transform="translate(102, 0)">
    <text x="0" y="46" font-family="'Inter', sans-serif" font-weight="800" font-size="30" fill="#FFFFFF" letter-spacing="1">POORNIMA</text>
    <text x="0" y="68" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#93C5FD" letter-spacing="2.5">ATTENDANCE SYSTEM</text>
  </g>
</svg>
