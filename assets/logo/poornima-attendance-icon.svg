<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pamsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="pamsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2563EB" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Geometric Container -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#pamsGrad)" filter="url(#pamsGlow)" />
  
  <!-- Graduation Cap (Top) -->
  <!-- Cap Diamond -->
  <polygon points="50,22 80,34 50,46 20,34" fill="#FFFFFF" opacity="0.95" />
  <!-- Cap Skull Base -->
  <path d="M 33,40 L 33,49 C 33,56 67,56 67,49 L 67,40" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <!-- Tassel -->
  <path d="M 72,35 L 77,48 L 77,54" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="77" cy="55" r="2" fill="#FDE047" />

  <!-- Open Book (Underneath Graduation Cap) -->
  <!-- Left Page -->
  <path d="M 22,60 C 35,56 46,62 48,78 C 36,74 24,76 22,60 Z" fill="#FFFFFF" opacity="0.9" />
  <!-- Right Page -->
  <path d="M 78,60 C 65,56 54,62 52,78 C 64,74 76,76 78,60 Z" fill="#FFFFFF" opacity="0.9" />
  <!-- Book Spine -->
  <path d="M 48,78 C 50,76 50,76 52,78 L 50,60 Z" fill="#E2E8F0" />
  <!-- Page Accent Lines -->
  <line x1="28" y1="67" x2="43" y2="67" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="27" y1="72" x2="40" y2="72" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="57" y1="67" x2="72" y2="67" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="60" y1="72" x2="73" y2="72" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
